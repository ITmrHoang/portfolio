backend:
  # config cho local proxy để không cần kết nối Github lúc đang code
  name: git-gateway
  branch: main
local_backend: true

# chạy local
# backend:
#   name: proxy
#   proxy_url: http://localhost:8081/api/v1

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Dự án (Projects)"
    folder: "src/content/projects"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Mô tả ngắn", name: "description", widget: "text", required: false}
      - {label: "Ảnh bìa", name: "coverImage", widget: "image", required: false}
      - {label: "Vai trò", name: "role", widget: "string", required: false}
      - {label: "Thời gian", name: "date", widget: "datetime", required: false}
      - {label: "Link GitHub", name: "github", widget: "string", required: false}
      - {label: "Link trang dự án", name: "demo", widget: "string", required: false, hint: "Trang khác: https://... — Trang trong site này: /playground/code-runner"}
      - {label: "Nhúng trang (iframe)", name: "embed", widget: "boolean", default: false, required: false, hint: "Bật để hiển thị trang dự án ngay trong trang chi tiết. Trang ngoài phải cho phép nhúng."}
      - {label: "Chiều cao khung nhúng (px)", name: "embedHeight", widget: "number", value_type: "int", min: 300, max: 1600, required: false}
      - {label: "Công nghệ sử dụng", name: "technologies", widget: "list", required: false}
      - {label: "Nội dung chi tiết", name: "body", widget: "markdown"}

  - name: "blog"
    label: "Bài viết (Blog)"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Ngày đăng", name: "date", widget: "datetime"}
      - {label: "Ngày cập nhật", name: "updatedDate", widget: "datetime", required: false}
      - {label: "Ảnh bìa", name: "coverImage", widget: "image", required: false}
      - {label: "Đoạn trích", name: "excerpt", widget: "text", required: false}
      - {label: "Thẻ (Tags)", name: "tags", widget: "list", required: false}
      - {label: "Nội dung", name: "body", widget: "markdown"}

  - name: "notes"
    label: "Ghi chú (Notes)"
    folder: "src/content/notes"
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - {label: "Tiêu đề", name: "title", widget: "string"}
      - {label: "Ngày viết", name: "date", widget: "datetime"}
      - {label: "Ngày cập nhật", name: "updatedDate", widget: "datetime", required: false}
      - {label: "Chủ đề (Topic)", name: "topic", widget: "select", options: ["Frontend", "Backend", "AI", "DevOps", "Design", "DSA", "Design Pattern", "Software Engineering", "CSS", "HTML", "HTML/CSS/JS", "Vanilla JS", "React & Web Tools", "Khác"], create: true, hint: "Thứ tự nhóm chủ đề chỉnh trong src/consts.ts (TOPIC_ORDER)"}
      - {label: "Cấp độ", name: "level", widget: "select", required: false, options: ["Cơ bản", "Trung cấp", "Nâng cao", "Chuyên sâu"]}
      - {label: "Thẻ (Tags)", name: "tags", widget: "list", required: false}
      - {label: "Nội dung", name: "body", widget: "markdown"}

  - name: "learn"
    label: "Góc Học Tập (Learn)"
    folder: "src/content/learn"
    nested:
      depth: 3
    create: true
    slug: "{{slug}}"
    extension: "mdx"
    format: "frontmatter"
    fields:
      - {label: "Tiêu đề bài học", name: "title", widget: "string"}
      - {label: "Mô tả ngắn", name: "description", widget: "text", required: false}
      - {label: "Tên Thể loại (VD: Java)", name: "categoryTitle", widget: "string", required: false}
      - {label: "Thứ tự Thể loại", name: "categoryOrder", widget: "number", default: 1, required: false}
      - {label: "Tên Session (VD: Session 1)", name: "sessionTitle", widget: "string", required: false}
      - {label: "Thứ tự Session", name: "sessionOrder", widget: "number", default: 1, required: false}
      - {label: "Thứ tự Bài học", name: "order", widget: "number", default: 1, required: false}
      - {label: "Loại bài học", name: "type", widget: "select", options: ["lesson", "quiz", "test", "reference"], default: "lesson", required: false}
      - {label: "Thẻ (Tags)", name: "tags", widget: "list", required: false}
      - {label: "Nội dung", name: "body", widget: "markdown"}

  - name: "certificates"
    label: "Chứng chỉ (Certificates)"
    folder: "src/content/certificates"
    create: true
    slug: "{{slug}}"
    extension: "yml"
    format: "yml"
    identifier_field: "title"
    fields:
      - {label: "Tên chứng chỉ", name: "title", widget: "string"}
      - {label: "Đơn vị cấp", name: "issuer", widget: "string"}
      - {label: "Ngày cấp", name: "date", widget: "datetime"}
      - {label: "Ảnh chứng chỉ", name: "image", widget: "image"}
      - {label: "Link xác minh", name: "credentialUrl", widget: "string", required: false}

  - name: "profile"
    label: "Hồ sơ cá nhân (About)"
    files:
      - label: "Thông tin giới thiệu"
        name: "profile"
        file: "src/data/profile.json"
        format: "json"
        fields:
          - {label: "Họ tên", name: "name", widget: "string"}
          - {label: "Biệt danh", name: "nickname", widget: "string"}
          - {label: "Dòng giới thiệu", name: "headline", widget: "string"}
          - {label: "Ảnh đại diện", name: "avatar", widget: "image"}
          - {label: "Giới thiệu ngắn", name: "intro", widget: "text"}
          - label: "Kỹ năng"
            name: "skills"
            widget: "list"
            fields:
              - {label: "Nhóm", name: "group", widget: "string"}
              - {label: "Danh sách", name: "items", widget: "list"}
