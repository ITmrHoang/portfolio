<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Bar</title>
    <style>
        .progress-reading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            z-index: 9999;
            transform-origin: left;

            animation: progress linear;
            animation-timeline: scroll();
            background:
                repeating-linear-gradient(
                45deg,
                #3b82f6 0 10px,
                #60a5fa 10px 20px
                );
                background-size: 200% 100%;
        }
        @keyframes progress {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }
    </style>
</head>

<body>
    <div class="progress-reading"></div>
    <div style="width: 100%; height: 100vh;background-color: red;"></div>
    <div style="width: 100%; height: 100vh;background-color: rgb(25, 0, 255);"></div>
    <div style="width: 100%; height: 100vh;background-color: rgb(9, 255, 0);"></div>
</body>

</html>
